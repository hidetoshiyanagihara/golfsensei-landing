# 一度だけ使う：YouTube のキーを Secrets に登録する（値は GitHub の公開鍵で暗号化済み。GitHub しか復号できない）
name: YouTube secrets (one-off)
on:
  push:
    branches: [claude/yt-secrets]
jobs:
  set:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開鍵を表示 / 暗号化済みの値を登録
        run: |
          if [ ! -f .github/yt-secrets.json ]; then
            gh api "repos/$REPO/actions/secrets/public-key"
            exit 0
          fi
          key_id=$(jq -r .key_id .github/yt-secrets.json)
          for name in $(jq -r '.values | keys[]' .github/yt-secrets.json); do
            jq -n --arg v "$(jq -r ".values.$name" .github/yt-secrets.json)" --arg k "$key_id" \
              '{encrypted_value:$v, key_id:$k}' | gh api -X PUT "repos/$REPO/actions/secrets/$name" --input - >/dev/null
            echo "登録: $name"
          done
          gh api "repos/$REPO/actions/secrets" --jq '.secrets[].name'
