# 【停止中】自動投稿は axion-autopost/（Daily SNS post）に一本化したため、定期実行は止めている。
# posts.csv の予定を手動で出したいときだけ Actions から Run workflow で使う。
# AXION SALES の SNS 予約投稿。sns/posts.csv の予定を確認し、時刻を過ぎた分を投稿する。
# 認証情報は Settings → Secrets and variables → Actions に登録（手順は sns/API_SETUP.md）。
# 投稿記録（result.csv）は sns-log ブランチに保存し、二重投稿を防ぐ。
name: SNS 予約投稿

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sns-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo  # posts.csv の予定日時は日本時間
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests requests-oauthlib

      - name: 投稿記録を取得
        run: |
          if git fetch --depth=1 origin sns-log; then
            git show FETCH_HEAD:result.csv > sns/result.csv || true
          fi

      - name: 投稿
        working-directory: sns
        run: python main.py post --mode live --yes

      - name: 投稿記録を保存
        if: always()
        run: |
          [ -f sns/result.csv ] || exit 0
          cp sns/result.csv "$RUNNER_TEMP/result.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin sns-log; then
            git worktree add "$RUNNER_TEMP/log" FETCH_HEAD
            cd "$RUNNER_TEMP/log" && git switch -C sns-log
          else
            git worktree add --orphan -b sns-log "$RUNNER_TEMP/log"
            cd "$RUNNER_TEMP/log"
          fi
          cp "$RUNNER_TEMP/result.csv" result.csv
          git add result.csv
          git diff --cached --quiet || { git commit -m "投稿記録を更新" && git push origin sns-log; }
