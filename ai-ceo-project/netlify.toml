# Netlify の設定（スマホから使う本番環境）。Netlify の「Base directory」は ai-ceo-project にする。
[build]
  command = "npm run build"
  publish = ".next"
  # このフォルダ（ai-ceo-project）に変更があったときだけビルドする。
  # リポジトリには自動投稿・フォーム営業のボットが毎日コミットするため、毎回ビルドすると無料枠（月300クレジット）を使い切ってしまう
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
